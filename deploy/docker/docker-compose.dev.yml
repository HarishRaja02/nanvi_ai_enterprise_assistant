services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nanvi
      POSTGRES_USER: nanvi_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local-only POSTGRES_PASSWORD before starting Compose}
    ports: ["5432:5432"]
    volumes: ["nanvi_pg_dev:/var/lib/postgresql/data"]

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]

volumes:
  nanvi_pg_dev:
