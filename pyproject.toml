[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanvi-ai-enterprise-assistant"
version = "0.1.0"
description = "Initial project structure for Nanvi AI Enterprise Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.128.2",
    "pydantic==2.13.4",
    "starlette==0.50.0",
    "uvicorn[standard]==0.48.0",
    "PyJWT==2.13.0",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "pypdf==6.19.0",
    "psycopg[binary,pool]==3.2.10",
    "langgraph==1.2.11",
    "reportlab==4.4.9",
    "redis==8.1.0",
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-exporter-otlp-proto-http==1.42.1",
    "python-pptx==1.0.2",
    "pymysql==1.2.3",
]


[project.optional-dependencies]
test = ["pytest==9.0.2", "cryptography==46.0.4", "PyYAML==6.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["tests*", "frontend*", "deploy*", "config*", "dr_backups*"]
